<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOS — Control Plane</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0b0f19;
        color: #f9fafb;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
    <script>
      window.addEventListener('error', function(event) {
        console.error('[DevOS Webview Error]:', event.error || event.message);
        var errBox = document.getElementById('debug-fatal-error');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'debug-fatal-error';
          errBox.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#1a0505;color:#ff5555;padding:24px;font-family:monospace;white-space:pre-wrap;z-index:999999;overflow:auto;font-size:14px;';
          document.body.appendChild(errBox);
        }
        errBox.textContent += '\n[JS Error]: ' + (event.message || '') + ' at ' + (event.filename || '') + ':' + (event.lineno || '') + '\n' + (event.error ? event.error.stack : '');
      });
      window.addEventListener('unhandledrejection', function(event) {
        console.error('[DevOS Webview Unhandled Rejection]:', event.reason);
        var errBox = document.getElementById('debug-fatal-error');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'debug-fatal-error';
          errBox.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#1a0505;color:#ff5555;padding:24px;font-family:monospace;white-space:pre-wrap;z-index:999999;overflow:auto;font-size:14px;';
          document.body.appendChild(errBox);
        }
        errBox.textContent += '\n[Promise Rejection]: ' + (event.reason ? (event.reason.stack || event.reason.message || event.reason) : event);
      });
    </script>
  </head>

  <body>
    <div id="root">
      <div id="devos-initial-splash" style="position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#0b0f19;color:#f9fafb;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <div style="width:64px;height:64px;animation:devos-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">
          <svg width="100%" height="100%" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

                <stop stop-color="#007B55" />

              </linearGradient>
              <linearGradient id="splash-g2" x1="86" y1="128" x2="86" y2="384" gradientUnits="userSpaceOnUse">

            </defs>
            <path fill="url(#splash-g1)" d="M86.352 246.358C137.511 214.183 161.836 245.017 183.168 285.573C165.515 317.716 153.837 337.331 148.132 344.418C137.373 357.788 125.636 367.911 111.202 373.752C80.856 388.014 43.132 388.681 14 371.048L86.352 246.358Z" />
            <path fill="url(#splash-g2)" fill-rule="evenodd" clip-rule="evenodd" d="M444.31 229.726C398.04 148.77 350.21 72.498 295.267 184.382C287.751 198.766 282.272 226.719 270 226.719V226.577C257.728 226.577 252.251 198.624 244.735 184.24C189.79 72.356 141.96 148.628 95.689 229.584C92.207 235.69 88.862 241.516 86 246.58C192.038 179.453 183.11 382.247 270 383.858V384C356.891 382.389 347.962 179.595 454 246.72C451.139 241.658 447.794 235.832 444.31 229.726Z" />
            <path fill="url(#splash-g3)" fill-rule="evenodd" clip-rule="evenodd" d="M450 384C476.509 384 498 362.509 498 336C498 309.491 476.509 288 450 288C423.491 288 402 309.491 402 336C402 362.509 423.491 384 450 384Z" />
          </svg>
        </div>
        <div style="margin-top:20px;font-size:13px;font-weight:500;letter-spacing:0.04em;color:#919eab;text-align:center;">
          DevOS Control Plane • Inicializando ambiente seguro...
        </div>
      </div>
    </div>
    <style>
      @keyframes devos-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.96); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
