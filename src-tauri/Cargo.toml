[package]
name = "app"
version = "1.0.0"
description = "ASPPIBRA DevOS Desktop — Native Core com Cofre Criptográfico e Infraestrutura DePIN"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["devtools"] }
tauri-plugin-log = "2"
bip39 = { version = "2.1", features = ["rand"] }
bip32 = { version = "0.5", features = ["secp256k1"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
k256 = { version = "0.13", features = ["ecdsa"] }
tokio = { version = "1", features = ["sync", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
calamine = "0.37"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
typst = "0.15"
typst-as-lib = "0.17"
typst-pdf = "0.15"
dirs = "6"
open = "5"



