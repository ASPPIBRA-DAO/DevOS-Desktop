<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente Neon Principal DevOS -->
    <linearGradient id="devos-cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00b8d9" />
      <stop offset="100%" stop-color="#0c68e9" />
    </linearGradient>

    <!-- Gradiente de Borda / Glow -->
    <linearGradient id="devos-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0c68e9" stop-opacity="0.2" />
    </linearGradient>

    <!-- Fundo Profundo DevOS -->
    <radialGradient id="devos-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="70%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05080f" />
    </radialGradient>

    <!-- Filtro de Brilho Cyberpunk -->
    <filter id="devos-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Mascara Esferica de Recorte -->
    <clipPath id="globe-clip">
      <circle cx="256" cy="256" r="176" />
    </clipPath>
  </defs>

  <!-- Fundo Circular do Aplicativo com Borda Neon -->
  <circle cx="256" cy="256" r="236" fill="url(#devos-bg)" stroke="url(#devos-border-grad)" stroke-width="4" />

  <!-- Anel Orbital Externo Sutil -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="#00b8d9" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35" />

  <!-- Globo Aramado DevOS (Centralizado e Iluminado) -->
  <g filter="url(#devos-glow)">
    <!-- Contorno Esférico Principal -->
    <circle cx="256" cy="256" r="176" fill="none" stroke="url(#devos-cyber-grad)" stroke-width="10" />

    <!-- Elementos Esféricos Internos -->
    <g clip-path="url(#globe-clip)">
      <!-- Equador Horizontal Central -->
      <line x1="80" y1="256" x2="432" y2="256" stroke="url(#devos-cyber-grad)" stroke-width="8" />

      <!-- Paralelo Norte (Latitude ~35°) -->
      <line x1="112" y1="155" x2="400" y2="155" stroke="url(#devos-cyber-grad)" stroke-width="7" />

      <!-- Paralelo Sul (Latitude ~-35°) -->
      <line x1="112" y1="357" x2="400" y2="357" stroke="url(#devos-cyber-grad)" stroke-width="7" />

      <!-- Meridiano Central Reto -->
      <line x1="256" y1="80" x2="256" y2="432" stroke="url(#devos-cyber-grad)" stroke-width="8" />

      <!-- Meridianos Curvos Elípticos (Leste e Oeste) -->
      <ellipse cx="256" cy="256" rx="88" ry="176" fill="none" stroke="url(#devos-cyber-grad)" stroke-width="7" />
    </g>

    <!-- Nós de Conexão Web3 Descentralizados (Hubs) -->
    <circle cx="256" cy="256" r="9" fill="#00f2fe" />
    <circle cx="168" cy="256" r="7" fill="#00f2fe" />
    <circle cx="344" cy="256" r="7" fill="#00f2fe" />
    <circle cx="256" cy="155" r="7" fill="#00f2fe" />
    <circle cx="256" cy="357" r="7" fill="#00f2fe" />
    <circle cx="188" cy="155" r="6" fill="#00f2fe" />
    <circle cx="324" cy="155" r="6" fill="#00f2fe" />
    <circle cx="188" cy="357" r="6" fill="#00f2fe" />
    <circle cx="324" cy="357" r="6" fill="#00f2fe" />
  </g>
</svg>
